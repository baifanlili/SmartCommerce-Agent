services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseekflash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_MODE: ${LLM_API_MODE:-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      LLM_API_KEY: ""
      LLM_MODEL: deepseekflash
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_API_MODE: chat
      LLM_TIMEOUT_SECONDS: 30
      LLM_MAX_RETRIES: 2
    depends_on:
      redis:
        condition: service_healthy

  api-bench:
    profiles: [bench]
    image: python:3.12-slim
    working_dir: /benchmark
    volumes:
      - ./benchmark:/benchmark
    command: ["python", "api_load.py", "--base-url", "http://api:8000", "--concurrency", "10", "--requests", "200", "--output", "results/api-baseline-v0.1.0.json"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
