name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: 后端测试（Docker）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行后端测试
        run: docker compose --profile test run --rm api-test

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

  compose-check:
    name: Compose 与镜像检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 Compose 配置
        run: docker compose config

      - name: 校验测试和压测配置
        run: |
          docker compose --profile test config
          docker compose --profile bench config

      - name: 构建 API、测试和 Web 镜像
        run: |
          docker compose --profile test build api-test
          docker compose build api web
